        description: Shown as a panel on the head, with a mark and the count.
      main-window-note: Changes appear in the main AIRI window.
    live2d-ambient-light:
      title: Live2D Ambient Light
      description: Tune screen sampling and the Live2D color-light shader
      controls:
        title: Light source and output
      enabled:
        title: Ambient light
        description: Apply the ambient-light filter to the active Live2D model.
      source:
        title: Light source
        options:
          screen-capture: Screen capture
          forced-color: Forced color
      mode:
        title: Lighting mode
        options:
          window-gradient: Window gradient
          global: Global ambient
      forced-color:
        title: Test color
        description: Apply this color without screen capture.
      strength:
        title: Light strength
        description: Set the overall effect amount. 1 is the designed look, and up to 3 makes the light wrap and the backlight stronger.
      squint:
        title: Squint at bright changes
        description: Narrow the eyes when the screen brightens faster than the character has adapted to it. A screen that stays bright leaves the eyes open. 0 turns this off.
      main-window-note: Changes appear in the main AIRI window.
      diagnostics:
        title: Capture diagnostics
        waiting: Waiting for diagnostics from the main AIRI window.
        status:
          disabled: Disabled
          starting: Starting
          capturing: Capturing
          forced-color: Forced color
          error: Error
        capture:
          title: Capture state
          description: Inspect the selected display, capture dimensions, and exclusion coordinates.
          display: Display and bounds
          video-size: Source video
          sample-size: Sample frame
          window-bounds: AIRI window bounds
          excluded-region: Excluded region
          exposure: Screen exposure
          behind-luminance: Light behind the character
          updated: Last update
        preview:
          title: Downscaled capture
          description: The red rectangle marks the AIRI window. The dashed rectangle marks the area that the light maps cover.
          unavailable: No captured frame is available.
        pixels:
          title: Pixel decisions
          total: Total
          accepted: Accepted
          excluded: Painted
          transparent: Transparent
          see-through: See-through
        maps:
          title: Light maps
          window: Each map covers the AIRI window and half a window on every side. The outline marks the window.
          unavailable: No environment is available.
          target: Measured
          applied: Applied after smoothing
          surround:
            title: Surround map
            description: Wide blur of the screen around and behind the window. It carries the color of the light and the side it comes from.
          contact:
            title: Contact map
            description: Narrow blur of the same content. This map drives the light wrap and the backlight rim.
      sampling:
        title: Screen sampling
        capture-interval:
          title: Capture interval
          description: Set the time between screen samples. The capture stream runs at this rate.
        response-time:
          title: Response time
          description: Set how quickly sampled colors adapt to a screen change.
        sample-width:
          title: Sample size
          description: Set the width of the downscaled capture frame. A wider frame puts more detail in the light maps. The height follows your display.
        neutral-color-weight:
          title: Neutral-color weight
          description: Set the minimum weight for colors with low saturation. Colored content counts for more than gray.
      shader:
        title: Shader response
        dark-base:
          title: Brightness floor
          description: Set the model brightness over a black screen. A white screen shows the model as drawn, and a darker screen dims it toward this floor.
        base-curve:
          title: Brightness curve
          description: Set how the model brightness rises between the floor and the artwork. Above 1 a half-lit screen keeps the model closer to the floor.
        local-share:
          title: Local light share
          description: Set how much of the model brightness follows the light beside it rather than the whole display. At 0 the model keeps one brightness wherever its window sits.
        tint:
          title: Tint
          description: Set how much of the screen hue the model takes. At 0 only the screen brightness reaches the model.
        color-boost:
          title: Dim-light color boost
          description: Set how much extra color the model takes from dim but saturated light. Brightness stays where the light put it, and no channel falls below the unlit model.
        wrap-intensity:
          title: Light wrap intensity
          description: Set how strongly the background color bleeds onto the edge of the model.
        wrap-saturation:
          title: Light wrap saturation
          description: Set how much of the screen hue the wrapped light keeps. 0 adds white light of the same brightness. 1 adds the full screen color.
        backlight:
          title: Backlight
          description: Set how strongly light from behind the character lights the thin rim along its whole edge.
        wrap-diffuse:
          title: Light wrap width
          description: Set how far the wrapped background color reaches inside the edge of the model.
        translucent-wrap:
          title: Reduce wrap on translucent parts
          description: Scale the light wrap and rim by the square of the model alpha. Parts drawn with partial alpha already show the desktop through themselves.
      preview-shader:
        title: Shader preview
        description: Run the real shader over a test card, with the live environment and the settings above.
        window-mapping: The filter takes this canvas as the whole stage window, so the preview is not a pixel-accurate copy of the stage.
        filtered: Shader output
        unavailable: The preview needs WebGL, and this window could not create a context.
        environment:
          live: Light comes from the latest snapshot that the main AIRI window published.
          neutral: No snapshot has arrived yet, so the preview uses the neutral environment.
        regions:
          title: Test card regions
          body: The wide body carries a tone ramp from sRGB {low} to {high}. Brightness, contrast, chroma, and headroom show along it.
          bars: The bars are {first}, {second}, {third}, {fourth}, and {fifth} pixels wide. They show how far the light wrap reaches into a thin shape.
          patches: The two patches are drawn at {strong} and {weak} alpha, which is what the translucent-wrap option acts on.

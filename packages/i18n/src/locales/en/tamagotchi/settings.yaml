    presence-sensing:
      title: Presence sensing
      description: See which signals this system lets AIRI sense, and why one is limited or unavailable.
      host: Host
      backend: Desktop backend
      backends:
        kwin: KDE KWin
        x11-ewmh: X11 EWMH
        sway: sway
        hyprland: Hyprland
        gnome: GNOME
        none: No supported desktop backend
      pending: AIRI has not read what this system can sense yet.
      status:
        live: Live
        degraded: Limited
        unavailable: Unavailable
      signals:
        cursorScreenPoint: Cursor position on screen
        windowOrigin: Window position on screen
        displayOrigins: Display positions
        systemIdleTime: Idle time
        screenLock: Screen lock
        foregroundWindow: Foreground window
        globalKeyUp: Global key release
        clickThroughForward: Click-through forwarding
        alwaysOnTop: Always on top
        systemAudioCapture: System audio capture
      reasons:
        linux-bridge-starting: The desktop bridge is starting.
        linux-bridge-failed: The desktop bridge failed.
        linux-foreground-verifying: The desktop bridge is verifying the foreground window.
        linux-cursor-verifying: The desktop bridge is verifying the cursor position.
        linux-geometry-verifying: The desktop bridge is verifying window and display positions.
        linux-keep-above-verifying: The desktop bridge is verifying that AIRI stays above other windows.
        linux-click-through-emulated: AIRI emulates click-through using verified cursor and window positions.
        gnome-needs-extension: GNOME needs a Shell extension to share the focused window and cursor; AIRI does not ship one yet.
        sway-cursor-unreported: sway does not report the global cursor position through its IPC.
        linux-desktop-unsupported: This desktop does not offer a way for AIRI to read the focused window.
        kwin-api-unsupported: This KWin version does not expose a supported scripting API.
        linux-portal-shortcut-unbound: The shortcut portal is connected, but no key release shortcut is bound.
        wayland-cursor-unreported: Wayland does not report the cursor position outside the window.
        wayland-window-origin-hidden: Wayland hides where the window sits on the screen.
        wayland-display-origin-unverified: Display positions under Wayland are not verified on this system.
        xwayland-idle-constant-zero: XWayland always reports zero idle time.
        wayland-idle-unverified: Idle time under Wayland becomes live once this system shows it advancing.
        linux-lock-events-undocumented: Linux screen lock events are not documented, so they may be missed.
        platform-no-foreground-binding: This system has no way to read the foreground window.
        foreground-binding-load-failed: The foreground window reader failed to load.
        wayland-no-global-input-hook: Wayland does not allow a global input hook.
        global-input-hook-load-failed: The global input hook failed to load.
        global-input-hook-start-failed: The global input hook failed to start.
        macos-accessibility-denied: Allow AIRI in Accessibility settings to read global keys.
        macos-window-titles-untrusted: Window titles are hidden until AIRI is allowed in Accessibility settings.
        linux-no-click-through-forward: Linux cannot forward clicks through a transparent window.
        wayland-no-z-order: Wayland does not let a window stay above other windows.
        linux-capture-audio-unverified: System audio capture on Linux is not verified.
        macos-capture-audio-requires-14-2: System audio capture needs macOS 14.2 or newer.
        web-sandbox: The browser sandbox does not expose this signal.
        web-page-pointer-only: The browser reports the pointer only while it is over the page.
      notice:
        title: AIRI cannot sense everything on this system
        body: 'Unavailable here: {signals}. She may not notice when you step away or come back.'
        details: Details

leave-mmd-notice:
  title: Desktop stage
  message: The desktop stage supports MMD models only.
  detail: >-
    The desktop stage keeps running until AIRI restarts. Relaunch to show the new
    model in the classic window. An unsent chat draft is not carried across the
    relaunch.
  relaunch: Relaunch into the classic window
  keep: Not now
click-through-notice:
  title: Desktop stage
  message: The desktop stage cannot pass clicks through on this desktop.
  detail: >-
    AIRI could not verify the cursor and window positions it needs, so the stage
    lets every click through to your desktop and the character cannot be clicked.
    Relaunch to use the classic window instead. An unsent chat draft is not
    carried across the relaunch.
  relaunch: Relaunch into the classic window
  keep: Not now
